name: Build & Deploy

on:
  push:
    branches: [main]

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Tests + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests
        run: pnpm test

  deploy:
    name: Deploy (coach API + web)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Deploy coach API (Cloudflare Worker)
        run: cd apps/worker && npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build web (Expo static export)
        run: pnpm --filter @intervals/expo export:web
        env:
          EXPO_PUBLIC_PB_URL: https://intervals.pockethost.io
          EXPO_PUBLIC_WORKER_URL: https://intervals-coach.imnick.workers.dev
          EXPO_NO_TELEMETRY: "1"
          CI: "1"

      - name: Deploy web (Cloudflare Pages)
        run: npx --yes wrangler@4.152.0 pages deploy apps/expo/dist --project-name=intervals --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
